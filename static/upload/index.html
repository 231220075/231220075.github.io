<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>图片上传</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; padding: 2rem; }
    .card { max-width: 640px; margin: 0 auto; border: 1px solid #e5e7eb; padding: 1rem; border-radius: 8px; }
    input[type=file] { display:block; margin-bottom: 0.5rem; }
    .result { margin-top: 1rem; word-break: break-all; }
  </style>
</head>
<body>
  <div class="card">
    <h1>图片上传</h1>
    <p>上传后会返回可直接引用的图片 URL（暂不限制上传者）。</p>
    <label>
      选择图片：
      <input id="file" type="file" accept="image/*" />
    </label>
    <div>
      <label>上传接口 URL： <input id="api" type="url" style="width:100%" value="http://127.0.0.1:8000/api/upload" /></label>
    </div>
    <div style="margin-top:.5rem">
      <button id="upload">上传</button>
      <button id="clear">清除</button>
    </div>

  <div class="result" id="result"></div>
  <hr />
  <h2>已上传图片</h2>
  <p>下面列出最近上传的图片（公开，任何人都可上传并查看）。</p>
  <div id="gallery" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px"></div>
  </div>

  <script>
  const fileEl = document.getElementById('file');
  const apiEl = document.getElementById('api');
  const uploadBtn = document.getElementById('upload');
  const clearBtn = document.getElementById('clear');
  const result = document.getElementById('result');
  const gallery = document.getElementById('gallery');

    function show(msg) { result.innerHTML = msg; }

    function renderGallery(items) {
      if (!Array.isArray(items)) return;
      gallery.innerHTML = items.slice().reverse().map(it => {
        const url = it.url || it.path || ('/uploads/' + it.filename);
        return `
          <div style="border:1px solid #eee;padding:6px;border-radius:6px;background:#fff;display:flex;flex-direction:column;align-items:center;">
            <a href="${url}" target="_blank"><img src="${url}" style="max-width:100%;height:120px;object-fit:cover;border-radius:4px"/></a>
            <div style="font-size:12px;margin-top:6px;word-break:break-all;text-align:center">${url}</div>
          </div>`;
      }).join('');
    }

    async function loadGallery() {
      try {
        const api = apiEl.value.replace(/\/api\/upload\/?$/,'/api/uploads');
        const res = await fetch(api, { method: 'GET' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        renderGallery(data);
      } catch (err) {
        console.warn('loadGallery failed', err);
      }
    }

    uploadBtn.addEventListener('click', async () => {
      const f = fileEl.files[0];
      if (!f) return show('<em>请先选择文件</em>');
      show('上传中...');
      try {
        const form = new FormData();
        form.append('file', f);
        const res = await fetch(apiEl.value, { method: 'POST', body: form });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const url = data.url || data.path || data.filename;
        let html = '<p>上传成功：</p>';
        html += '<p><a href="' + url + '" target="_blank">' + url + '</a></p>';
        if (url) html += '<p><img src="' + url + '" style="max-width:100%" /></p>';
        show(html);
        // prepend new image to gallery
        try {
          const cur = gallery.innerHTML;
          const itemHtml = `<div style="border:1px solid #eee;padding:6px;border-radius:6px;background:#fff;display:flex;flex-direction:column;align-items:center;"><a href="${url}" target="_blank"><img src="${url}" style="max-width:100%;height:120px;object-fit:cover;border-radius:4px"/></a><div style="font-size:12px;margin-top:6px;word-break:break-all;text-align:center">${url}</div></div>`;
          gallery.innerHTML = itemHtml + cur;
        } catch (e) { /* ignore */ }
      } catch (err) {
        show('<span style="color:#b91c1c">上传失败：' + (err.message || err) + '</span>');
      }
    });

  clearBtn.addEventListener('click', () => { fileEl.value = ''; show(''); });

  // initial load and periodic refresh
  loadGallery();
  setInterval(loadGallery, 30000); // refresh every 30s
  </script>
</body>
</html>
